name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (fmt, clippy, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all --check

      # The app crate embeds app/ui/dist, so the UI is built before clippy and tests.
      - name: UI (types, lint, format, tests, build)
        working-directory: app/ui
        run: |
          npm install --global pnpm@12.14.0
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm fmt:check
          pnpm test
          pnpm build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # The version lives only in Cargo.toml; the app bundle inherits it when
      # tauri.conf.json has no "version" field.
      - name: Check the version is single-sourced
        run: |
          node -e 'if ("version" in require("./app/tauri.conf.json")) { console.error("Remove \"version\" from app/tauri.conf.json; Cargo.toml is the source"); process.exit(1) }'
          want=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "anvil") | .version')
          got=$(cargo run -q --locked -- --version)
          test "$got" = "anvil $want" || { echo "anvil --version printed '$got', expected 'anvil $want'"; exit 1; }

  # The core library and CLI only use Unix APIs, so they build and test on
  # Linux too. The Tauri app is macOS-only and is not built here.
  linux:
    name: Linux (anvil crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build -p anvil --locked

      - name: Test
        run: cargo test -p anvil --locked
