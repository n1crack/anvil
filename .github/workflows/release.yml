name: Release

# Push a tag like v0.1.0 (see CONTRIBUTING.md, "Releases"). This builds the
# macOS app and the anvil CLI and creates a DRAFT GitHub Release; review and
# publish it by hand.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS app and CLI
    runs-on: macos-latest
    permissions:
      contents: write # create the draft release and upload its assets
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the tag matches the Cargo version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "anvil") | .version')
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match Cargo.toml version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          # Everything between "## [<version>]" and the next "## [" heading,
          # without the link definitions at the end of the file.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]*\]: / { print }
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      # `cargo tauri build` builds the UI first (beforeBuildCommand: pnpm build in app/ui).
      - name: Install the UI's dependencies
        working-directory: app/ui
        run: |
          npm install --global pnpm@12.14.0
          pnpm install --frozen-lockfile

      # One universal .dmg runs natively on Apple Silicon and Intel, so there is
      # no wrong download to pick. Signing and notarization only happen when the
      # secrets exist: the Tauri bundler treats a variable that is set but empty
      # as "sign with this", so empty ones are unset. The secrets live only in
      # this step's environment; later steps never see them. The updater key is
      # required: installed apps find new versions through the signed
      # latest.json, so a release without it would strand them.
      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(printenv "$name" || true)" ]; then
              unset "$name"
              echo "$name is not set"
            else
              echo "$name is set"
            fi
          done
          cd app
          # tauri.cli.conf.json puts the anvil CLI inside the app (Contents/MacOS/anvil);
          # createUpdaterArtifacts adds the signed Anvil.app.tar.gz the updater installs.
          cargo tauri build --target universal-apple-darwin --bundles app,dmg \
            --config tauri.cli.conf.json --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Build the CLI
        run: |
          # The universal one bundle-cli.sh made for the app; one download, like the .dmg.
          mkdir -p dist
          stage="anvil-$VERSION-universal-apple-darwin"
          mkdir -p "$stage"
          cp app/binaries/anvil-universal-apple-darwin "$stage/anvil"
          cp LICENSE README.md CHANGELOG.md "$stage/"
          tar -czf "dist/$stage.tar.gz" "$stage"

      - name: Collect assets and checksums
        run: |
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
          # The updater's archive and latest.json: one universal app for both
          # architectures. The URL works once the draft is published.
          bundle=target/universal-apple-darwin/release/bundle/macos
          archive="Anvil-$VERSION-universal.app.tar.gz"
          cp "$bundle/Anvil.app.tar.gz" "dist/$archive"
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/$archive"
          jq -n --arg v "$VERSION" --rawfile notes notes.md --rawfile sig "$bundle/Anvil.app.tar.gz.sig" \
            --arg url "$url" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $sig, url: $url},
              "darwin-x86_64": {signature: $sig, url: $url}}}' > dist/latest.json
          cd dist
          shasum -a 256 -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --draft $flags --verify-tag \
            --title "Anvil $VERSION" --notes-file notes.md
