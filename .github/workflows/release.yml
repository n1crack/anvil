name: Release

# Push a tag like v0.1.0 (see CONTRIBUTING.md, "Releases"). This builds the
# macOS and Windows apps and the anvil CLI and creates a DRAFT GitHub Release;
# review and publish it by hand. Run it by hand (Actions › Release › Run
# workflow) for a dry run: the same signed, notarized build and its checks, no
# release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS app and CLI
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the tag matches the Cargo version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "anvil") | .version')
          if [ "$DRY_RUN" = true ]; then
            echo "TAG=v$version" >> "$GITHUB_ENV"
          else
            test "$TAG" = "v$version" || { echo "Tag $TAG does not match Cargo.toml version $version"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      # `cargo tauri build` builds the UI first (beforeBuildCommand: pnpm build in app/ui).
      - name: Install the UI's dependencies
        working-directory: app/ui
        run: |
          npm install --global pnpm@12.14.0
          pnpm install --frozen-lockfile

      # One universal .dmg runs natively on Apple Silicon and Intel, so there is
      # no wrong download to pick. Signing and notarization only happen when the
      # secrets exist: the Tauri bundler treats a variable that is set but empty
      # as "sign with this", so empty ones are unset. The secrets live only in
      # this step's environment; later steps never see them. The updater key is
      # required: installed apps find new versions through the signed
      # latest.json, so a release without it would strand them.
      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(printenv "$name" || true)" ]; then
              # A dry run is there to check signing and notarization.
              [ "$DRY_RUN" = true ] && { echo "$name is not set"; exit 1; }
              unset "$name"
              echo "$name is not set"
            else
              echo "$name is set"
            fi
          done
          cd app
          # tauri.cli.conf.json puts the anvil CLI inside the app (Contents/MacOS/anvil);
          # createUpdaterArtifacts adds the signed Anvil.app.tar.gz the updater installs.
          cargo tauri build --target universal-apple-darwin --bundles app,dmg \
            --config tauri.cli.conf.json --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # Signed with the Developer ID, the CLI inside it too, and notarized with the
      # ticket stapled, so Gatekeeper opens it offline. Skipped for an unsigned build.
      - name: Check signing and notarization
        env:
          SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          [ "$SIGNED" = true ] || { echo "Unsigned build: nothing to check"; exit 0; }
          app=target/universal-apple-darwin/release/bundle/macos/Anvil.app
          codesign --verify --deep --strict --verbose=2 "$app"
          cli=$(codesign -dv --verbose=2 "$app/Contents/MacOS/anvil" 2>&1)
          echo "$cli" | grep -q 'Authority=Developer ID Application' || { echo "$cli"; echo "The CLI isn't signed with the Developer ID"; exit 1; }
          echo "$cli" | grep -q 'runtime' || { echo "$cli"; echo "The CLI lacks the hardened runtime"; exit 1; }
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          for dmg in target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg" || echo "note: $dmg itself is not notarized; the app inside is"
          done

      - name: Build the CLI
        run: |
          # The universal one from inside the app: signed with the Developer ID and
          # notarized with it, so a browser download opens (app/binaries' copy is
          # ad-hoc signed). One download, like the .dmg.
          mkdir -p dist
          stage="anvil-$VERSION-universal-apple-darwin"
          mkdir -p "$stage"
          cp target/universal-apple-darwin/release/bundle/macos/Anvil.app/Contents/MacOS/anvil "$stage/anvil"
          cp LICENSE README.md CHANGELOG.md "$stage/"
          tar -czf "dist/$stage.tar.gz" "$stage"

      - name: Collect assets
        run: |
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
          # The updater's archive: one universal app for both architectures.
          bundle=target/universal-apple-darwin/release/bundle/macos
          cp "$bundle/Anvil.app.tar.gz" "dist/Anvil-$VERSION-universal.app.tar.gz"
          cp "$bundle/Anvil.app.tar.gz.sig" "dist/Anvil-$VERSION-universal.app.tar.gz.sig"
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows app and CLI
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the tag matches the Cargo version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "anvil") | .version')
          if [ "$DRY_RUN" = true ]; then
            echo "TAG=v$version" >> "$GITHUB_ENV"
          else
            test "$TAG" = "v$version" || { echo "Tag $TAG does not match Cargo.toml version $version"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Install the UI's dependencies
        working-directory: app/ui
        run: |
          npm install --global pnpm@12.14.0
          pnpm install --frozen-lockfile

      # The CLI first (bundle-cli.sh, which tauri.cli.conf.json would run through
      # cmd.exe), then the per-user NSIS installer with anvil.exe next to
      # anvil-app.exe. createUpdaterArtifacts signs the installer itself: the
      # updater runs it. The installer isn't code-signed yet, so SmartScreen
      # asks before the first run.
      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          TAURI_ENV_TARGET_TRIPLE=x86_64-pc-windows-msvc sh app/bundle-cli.sh
          cd app
          cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis --config tauri.cli.conf.json \
            --config '{"build":{"beforeBuildCommand":{"script":"pnpm build","cwd":"ui"}},"bundle":{"createUpdaterArtifacts":true}}'

      - name: Collect assets
        run: |
          mkdir -p dist
          nsis=target/x86_64-pc-windows-msvc/release/bundle/nsis
          cp "$nsis/Anvil_${VERSION}_x64-setup.exe" "$nsis/Anvil_${VERSION}_x64-setup.exe.sig" dist/
          stage="anvil-$VERSION-x86_64-pc-windows-msvc"
          mkdir -p "$stage"
          cp app/binaries/anvil-x86_64-pc-windows-msvc.exe "$stage/anvil.exe"
          cp LICENSE README.md CHANGELOG.md "$stage/"
          7z a -tzip "dist/$stage.zip" "$stage" > /dev/null
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  release:
    name: Draft release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload its assets
    env:
      TAG: ${{ github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "anvil") | .version')
          [ "$DRY_RUN" = true ] && echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          # Everything between "## [<version>]" and the next "## [" heading,
          # without the link definitions at the end of the file.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]*\]: / { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            [ "$DRY_RUN" = true ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
            echo "Dry run of $VERSION." > notes.md
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      # latest.json: where installed apps find this version. One universal macOS
      # app for both architectures; on Windows the updater runs the installer.
      # The URLs work once the draft is published.
      - name: Updater manifest and checksums
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          mac="Anvil-$VERSION-universal.app.tar.gz"
          win="Anvil_${VERSION}_x64-setup.exe"
          jq -n --arg v "$VERSION" --rawfile notes notes.md --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile macsig "dist/$mac.sig" --arg mac "$base/$mac" \
            --rawfile winsig "dist/$win.sig" --arg win "$base/$win" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $macsig, url: $mac},
              "darwin-x86_64": {signature: $macsig, url: $mac},
              "windows-x86_64": {signature: $winsig, url: $win}}}' > dist/latest.json
          rm dist/*.sig
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A draft left by an earlier run of this tag gets this run's assets; a
      # published release is never touched.
      - name: Create the draft release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = true ]; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          elif [ -n "$draft" ]; then
            echo "$TAG is already published"; exit 1
          else
            gh release create "$TAG" dist/* --draft $flags --verify-tag \
              --title "Anvil $VERSION (beta)" --notes-file notes.md
          fi
