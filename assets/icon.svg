<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2e34"/>
      <stop offset="1" stop-color="#121316"/>
    </linearGradient>
    <radialGradient id="heat" cx="512" cy="372" r="300" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 372) scale(1 0.55) translate(0 -372)">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bec7"/>
      <stop offset="0.35" stop-color="#7d838d"/>
      <stop offset="1" stop-color="#50555d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff8a1f"/>
      <stop offset="0.5" stop-color="#ffd166"/>
      <stop offset="0.75" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body"><path id="anvil" d="
      M 380 372 L 822 372 L 822 452 Q 822 464 810 464 L 704 464
      Q 650 468 640 524 L 632 594
      Q 648 636 728 652 Q 752 657 752 680 L 752 712 L 612 712
      Q 600 690 578 690 L 446 690 Q 424 690 412 712
      L 272 712 L 272 680
      Q 272 657 296 652 Q 376 636 392 594 L 384 524
      Q 378 474 330 466 C 262 458 212 440 194 414
      Q 186 398 200 392 C 250 378 310 372 380 372 Z"/></clipPath>
  </defs>

  <!-- macOS icon body: 824x824, inset 100, transparent outside -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="3"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#heat)"/>

  <g transform="translate(512 528) scale(1.1) translate(-506 -542)">
  <!-- floor shadow -->
  <ellipse cx="512" cy="716" rx="290" ry="22" fill="#000" opacity="0.45"/>

  <!-- anvil -->
  <use href="#anvil" fill="url(#steel)"/>
  <g clip-path="url(#body)">
    <rect x="180" y="372" width="660" height="350" fill="url(#sheen)"/>
    <!-- face plate (top surface) -->
    <rect x="180" y="372" width="660" height="26" fill="#d6dae0"/>
    <!-- heat glowing in the face -->
    <rect x="300" y="372" width="500" height="26" fill="url(#hot)"/>
    <!-- underside of the face block -->
    <rect x="180" y="458" width="660" height="10" fill="#000" opacity="0.18"/>
    <!-- base band -->
    <rect x="180" y="694" width="660" height="18" fill="#000" opacity="0.22"/>
  </g>
  <use href="#anvil" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="2"/>
  </g>
</svg>
