[package]
name = "anvil"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Anvil — your tools, your rules. A free, open local dev environment."

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.1.8"

[workspace]
members = ["app"]

# The one place the release version lives: both crates inherit it, and the app
# bundle reads it too (tauri.conf.json has no "version" on purpose).
# Bump it with scripts/bump-version.sh.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
