[package]
name = "anvil"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Anvil — your tools, your rules. A free, open local dev environment."

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[workspace]
members = ["app"]
