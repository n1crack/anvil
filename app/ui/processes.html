<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Processes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="activity">
  <header class="titlebar" data-tauri-drag-region>
    <h1 class="visually-hidden">Processes</h1>
    <div id="tabs" class="seg act-tabs" role="tablist" aria-label="Show">
      <button role="tab" data-tab="web">Web server<span class="act-count"></span></button>
      <button role="tab" data-tab="apps">Apps<span class="act-count"></span></button>
      <button role="tab" data-tab="services">Services<span class="act-count"></span></button>
    </div>
  </header>
  <p id="error" class="error" role="alert" hidden></p>
  <div class="act-main">
  <div class="act-table">
    <table>
      <thead>
        <tr><th>Name</th><th class="num">Port</th><th class="num">PID</th><th class="num">CPU</th><th class="num">Memory</th><th class="act-st">Status</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="act-empty" hidden>Nothing running</p>
  </div>
  <div id="split" class="act-split" role="separator" aria-orientation="vertical" aria-label="Resize log" hidden></div>
  <aside id="pane" class="act-pane" hidden>
    <header class="act-pane-head">
      <span id="log-title"></span>
      <button id="log-close" class="icon-btn" aria-label="Close log">×</button>
    </header>
    <pre id="log" class="act-log" aria-label="Log"></pre>
  </aside>
  </div>
  <script type="module" src="/src/activity.ts"></script>
</body>
</html>
