<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anvil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="titlebar" data-tauri-drag-region></div>
    <div class="toolbar">
      <label class="search">
        <span class="visually-hidden">Search applications</span>
        <input id="search" type="search" placeholder="Search applications" autocomplete="off" spellcheck="false">
      </label>
      <button id="reload" class="icon-btn" title="Reload applications (⌘R)" aria-label="Reload applications">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <form id="ask" class="ask" hidden>
      <label id="ask-label" for="ask-input"></label>
      <input id="ask-input" autocomplete="off" spellcheck="false">
    </form>
    <nav id="list" class="list" aria-label="Applications"></nav>
  </aside>

  <main class="detail">
    <header class="titlebar" data-tauri-drag-region>
      <button id="open-settings" class="icon-btn" title="Settings (⌘,)" aria-label="Settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h7M12.5 4.5h1M2.5 11.5h1M6.5 11.5h7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="11" cy="4.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5" cy="11.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button id="power" class="power" role="switch" aria-checked="false" title="Web server and local domains for all your applications">
        <span class="ingot" aria-hidden="true"></span>
        <span id="power-label">Stopped</span>
      </button>
    </header>
    <div id="error" class="error" role="alert" hidden>
      <span id="error-text"></span>
      <button id="error-close" class="icon-btn" aria-label="Dismiss">×</button>
    </div>
    <section id="site" class="site" aria-live="polite"></section>
  </main>

  <template id="site-tpl">
    <header class="site-head">
      <div class="site-title">
        <span class="mark big" aria-hidden="true"></span>
        <div>
          <h1 class="site-name"></h1>
          <a class="site-url" href="#"></a>
        </div>
      </div>
      <div class="run-box" hidden>
        <span class="state"><span class="dot" aria-hidden="true"></span><span class="state-text"></span></span>
        <button data-run="start">Start</button>
        <button data-run="restart">Restart</button>
        <button data-run="stop">Stop</button>
      </div>
    </header>
    <p class="run-error error" hidden></p>

    <div class="quick">
      <button data-open="browser" title="Open in browser">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M10.5 5.5 9 9l-3.5 1.5L7 7z"/></svg>Browser
      </button>
      <button data-open="finder" title="Show in Finder">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 4.25a1 1 0 0 1 1-1h3.5l1.5 1.5h5.5a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H2.75a1 1 0 0 1-1-1z"/></svg>Finder
      </button>
      <button data-open="terminal" title="Open Terminal here">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1.5"/><path d="m4.5 6.5 2 1.5-2 1.5M8 10h3"/></svg>Terminal
      </button>
      <button data-open="editor" class="editor-btn" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.75 13.25 5.5 6 12.75H3.25V10z"/></svg><span>Editor</span>
      </button>
      <button class="show-log" title="Open the app’s log" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.75 1.75h6l2.5 2.5v10h-8.5z"/><path d="M6 7h4M6 9.5h4M6 12h2.5"/></svg>Log
      </button>
    </div>

    <div class="tabs" role="tablist" aria-label="Application">
      <button role="tab" data-tab="overview">Overview</button>
      <button role="tab" data-tab="settings">Settings</button>
      <button role="tab" data-tab="resources">Resources</button>
      <button class="icon-btn res-reload" title="Measure again" aria-label="Measure resources again" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <section role="tabpanel" data-panel="overview">
      <dl class="group">
        <div class="row"><dt>Type</dt><dd data-field="kind"></dd></div>
        <div class="row"><dt>Runs on</dt><dd data-field="runtime"></dd></div>
        <div class="row"><dt>Folder</dt><dd class="path" data-field="path"></dd></div>
        <div class="row php-only"><dt>Web root</dt><dd class="path" data-field="root"></dd></div>
        <div class="row"><dt>Disk</dt><dd data-field="disk" class="muted">Measuring…</dd></div>
        <div class="row"><dt>Services</dt><dd data-field="services" class="muted">Measuring…</dd></div>
      </dl>
    </section>

    <section role="tabpanel" data-panel="settings" hidden>
      <dl class="group">
        <div class="row">
          <dt><label for="kind">Type</label></dt>
          <dd><select id="kind"></select></dd>
        </div>
        <div class="row php-only">
          <dt><label for="php">PHP version</label></dt>
          <dd><select id="php"></select></dd>
        </div>
        <div class="row php-only">
          <dt><label for="ini-memory">Memory limit</label></dt>
          <dd><input id="ini-memory" data-ini="memory_limit" spellcheck="false"></dd>
        </div>
        <div class="row php-only">
          <dt><label for="ini-upload" title="Largest file a form can upload">Upload limit</label></dt>
          <dd><input id="ini-upload" data-ini="upload_max_filesize" spellcheck="false"></dd>
        </div>
        <div class="row php-only">
          <dt><label for="ini-time" title="Seconds before a request is stopped">Max execution time</label></dt>
          <dd><input id="ini-time" data-ini="max_execution_time" spellcheck="false"></dd>
        </div>
        <div class="row row-top php-only">
          <dt><label for="ini-extra" title="Any php.ini setting, one per line">Other PHP settings</label></dt>
          <dd><textarea id="ini-extra" rows="3" spellcheck="false" placeholder="display_errors = On"></textarea></dd>
        </div>
        <div class="row process-only">
          <dt><label for="app-command" title="Runs in the project folder with $PORT set">Start command</label></dt>
          <dd><input id="app-command" spellcheck="false"></dd>
        </div>
        <div class="row process-only">
          <dt><label for="app-port">Port</label></dt>
          <dd><input id="app-port" inputmode="numeric" spellcheck="false"></dd>
        </div>
        <div class="row process-only">
          <dt><label for="app-autostart">Start with Anvil</label></dt>
          <dd><input id="app-autostart" type="checkbox" role="switch"></dd>
        </div>
      </dl>
    </section>

    <section role="tabpanel" data-panel="resources" hidden>
      <div class="res-body"></div>
    </section>
  </template>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
