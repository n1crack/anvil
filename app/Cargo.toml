[package]
name = "anvil-app"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anvil = { path = ".." }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
