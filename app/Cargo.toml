[package]
name = "anvil-app"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anvil = { path = ".." }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
